root = "."
tmp_dir = "tmp"

[build]
cmd = "go build -o ./tmp/main ."
# ビルドされたバイナリのパス
bin = "./tmp/main"
# 変更を監視するファイル拡張子
include_ext = ["go"]
# 監視から除外するディレクトリ
exclude_dir = ["tmp"]
# ログの色付け
log_color_main = "cyan"
log_color_build = "yellow"
log_color_runner = "green"

[misc]
# ビルド失敗時にクリーンアップ
clean_on_exit = true